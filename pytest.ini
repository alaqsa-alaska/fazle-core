[pytest]
# Repo-root config so a bare `pytest` (or `pytest .`) run from /home/azim/core
# behaves safely by default. tests/pytest.ini is the one actually used when
# invoking with tests/-prefixed args (pytest's ini discovery finds the
# nearest ancestor ini to the given args first) — this file exists so a
# root-level invocation isn't left with pytest's un-configured defaults
# (asyncio_mode=strict breaks every bare `async def test_*`, and no
# testpaths restriction would happily collect tests/e2e/ alongside
# everything else). See tests/conftest.py's pytest_collection_modifyitems
# for the bulletproof version of the e2e-isolation guard that catches
# every invocation style, not just this one.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests/unit tests/integration tests/db tests/workflows tests/resilience
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -q
timeout = 30

markers =
    unit: Pure unit tests (no I/O)
    integration: API integration tests (requires test DB)
    db: Database consistency tests (requires test DB)
    workflow: End-to-end workflow simulation
    load: Load / stress tests
    resilience: Failure recovery tests
    e2e: Playwright browser tests (slow)
    slow: Slower tests (>5s each)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestDeprecationWarning
